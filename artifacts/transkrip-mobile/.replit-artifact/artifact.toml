kind = "mobile"
previewPath = "/mobile/"
title = "Transkrip Mobile"
version = "1.0.0"
id = "artifacts/transkrip-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18899

[services.development]
run = "pnpm --filter @workspace/transkrip-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/transkrip-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/transkrip-mobile", "run", "serve" ]

[services.env]
PORT = "18899"
BASE_PATH = "/mobile/"
