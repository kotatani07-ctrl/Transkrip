<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Transkrip & Ijazah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a5276 0%, #2e86c1 60%, #1abc9c 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .login-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1a5276, #2e86c1);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem; color: #fff;
    }
    h4 { font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #64748b; font-size: .85rem; margin-bottom: 28px; }
    .form-control:focus { border-color: #2e86c1; box-shadow: 0 0 0 .2rem rgba(46,134,193,.15); }
    .btn-login {
      background: linear-gradient(135deg, #1a5276, #2e86c1);
      border: none; color: #fff; width: 100%; padding: 11px;
      border-radius: 8px; font-weight: 600; font-size: .95rem;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
    .label-input { font-size: .85rem; font-weight: 500; color: #374151; margin-bottom: 4px; }
    .footer-text { text-align: center; font-size: .75rem; color: #94a3b8; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon"><i class="bi bi-mortarboard-fill"></i></div>
    <h4>Sistem Transkrip & Ijazah</h4>
    <p class="subtitle">Otomasi Generate Transkrip Neo Feeder PDDIKTI</p>

    {% if form.errors %}
    <div class="alert alert-danger py-2 mb-3 small">
      <i class="bi bi-exclamation-triangle me-1"></i>
      Username atau password salah.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="label-input">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Masukkan username" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label class="label-input">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Masukkan password" required>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
      </button>
    </form>

    <p class="footer-text">Aplikasi internal — akses terbatas</p>
  </div>
</body>
</html>
